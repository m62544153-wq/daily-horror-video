
name: Daily Horror Test

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run test
        run: python make_video.py

      - name: Save story
        uses: actions/upload-artifact@v4
        with:
          name: horror-story-test
          path: output/story.txt
          retention-days: 7
          
